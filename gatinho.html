<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uma Galaxia Só Para Você</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#020a06;--pink:#3dff9a;--soft:#b6ffd6;--card:rgba(6,26,16,.82);--txt:#fff;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Poppins',system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;display:block;touch-action:none}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));transition:opacity .9s,visibility .9s;z-index:5;
background:radial-gradient(circle at 30% 20%,#0d3320,transparent 60%),var(--bg)}
.hide{opacity:0;visibility:hidden}
.card{width:min(340px,100%);text-align:center;padding:32px 24px;border-radius:22px;background:var(--card);border:1px solid rgba(61,255,154,.25);box-shadow:0 0 60px rgba(61,255,154,.18)}
h1{font-family:'Playfair Display',Georgia,serif;font-size:2rem;line-height:1.2;margin-bottom:18px}
.pic{font-size:4.5rem;margin:6px 0 14px;filter:drop-shadow(0 0 14px rgba(61,255,154,.6));animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.sub{font-size:.7rem;letter-spacing:.2em;color:var(--soft);margin-bottom:22px;text-transform:uppercase;font-weight:300}
button{font:500 .68rem 'Poppins',sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-radius:999px;padding:11px 22px;border:0}
.main{background:linear-gradient(90deg,#7dffb8,#2fd17a);color:#03230f}
.back{background:transparent;color:var(--txt);border:1px solid rgba(255,255,255,.3);padding:8px 16px}
.img{height:150px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:5rem;margin-bottom:16px;overflow:hidden;
background:radial-gradient(circle,#14603a,#04140b)}
.img img{width:100%;height:100%;object-fit:cover}
h2{font-family:'Playfair Display',Georgia,serif;font-size:1.15rem;margin-bottom:8px}
p{font-size:.72rem;line-height:1.6;color:#d3f3e0;margin-bottom:18px;font-weight:300}
#hint{position:fixed;left:0;right:0;bottom:calc(14px + var(--safe-b));text-align:center;font-size:.65rem;letter-spacing:.18em;color:var(--soft);opacity:.7;pointer-events:none;text-transform:uppercase;z-index:2}

.ctl{position:fixed;top:calc(12px + var(--safe-t));right:12px;z-index:6;display:none}
.ctl.on{display:block}
.ctl button{width:44px;height:44px;padding:0;font-size:19px;letter-spacing:0;border-radius:50%;background:rgba(6,26,16,.72);border:1px solid rgba(61,255,154,.4);color:#fff;box-shadow:0 0 18px rgba(61,255,154,.25)}
.ctl button:focus-visible,.back:focus-visible,.main:focus-visible{outline:2px solid #fff;outline-offset:3px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.img img.sym{object-fit:contain;padding:12px;filter:drop-shadow(0 0 14px rgba(61,255,154,.7))}
.pic{perspective:420px}
.pic img{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(61,255,154,.75));animation:spin3d 7s linear infinite}
@keyframes spin3d{to{transform:rotateY(360deg)}}
@media (prefers-reduced-motion:reduce){.pic img{animation:none}}

*{cursor:none!important}
#bf{position:fixed;left:0;top:0;width:48px;height:48px;z-index:99;pointer-events:none;opacity:0;transition:opacity .3s;filter:drop-shadow(0 0 8px rgba(255,190,70,.8));--fs:.2s}
.ctl.on{display:flex;gap:8px}
#bf.on{opacity:1}#bfi{width:48px;height:48px}#bfi svg{width:48px;height:48px;overflow:visible}
.wg{transform-origin:0 0;animation:flap var(--fs) ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.2)}}
.pic img{width:auto;height:170px;max-width:100%;object-fit:contain;border:0;border-radius:0;box-shadow:none;filter:drop-shadow(0 0 16px rgba(61,255,154,.55));animation:none}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
.card,.card p,.card h1,.card h2{-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<div id="intro" class="screen">
  <div class="card">
    <h1>Uma Galaxia Só Para Você</h1>
    <div class="pic"><img id="introPic" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="></div>
    <div class="sub">Com todo meu amor e carinho</div>
    <button class="main" id="enter">Entrar no nosso universo</button>
  </div>
</div>
<div id="modal" class="screen hide" style="background:rgba(0,0,0,.78)">
  <div class="card">
    <div class="img" id="mImg"></div>
    <h2 id="mT"></h2><p id="mP"></p>
    <div class="row"><button class="back" id="paste"> Colar foto</button><button class="back" id="close">Voltar ♥</button></div><input type="file" id="file" accept="image/*" hidden>
  </div>
</div>
<div class="ctl" id="ctl"><button id="jur" aria-label="Juras" title="Juras">💌</button><button id="mus" aria-label="Pausar música" title="Música">🔊</button></div>

 const z=.2+R()*.22,a=R()*TAU,r=R()*.9;s.scale.set(z,z,1);
 s.position.set(cat.position.x+Math.cos(a)*r,cat.position.y+3.9+R()*1.1,cat.position.z+Math.sin(a)*r);
 s.userData={v:.9+R()*.7,l:0,dx:g()*.5,life:1.3+R()*.7};scene.add(s);hearts.push(s);}}
function popHearts(n){for(let i=0;i<n;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:heartTex,transparent:true,depthWrite:false,blending:ADD}));
 const z=.6+R()*.6;s.scale.set(z,z,1);s.position.set(cat.position.x+g()*1.6,cat.position.y+6.4+R(),cat.position.z+g()*1.6);s.userData={v:1.4+R()*1.2,l:0};scene.add(s);hearts.push(s);}}

/* ===== Sons de gatinho (Web Audio, sem arquivos) ===== */
let AC,sfx,purrG,lastM=0;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
 sfx=AC.createGain();sfx.gain.value=1;sfx.connect(AC.destination);
 const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=R()*2-1;
 const s=AC.createBufferSource();s.buffer=nb;s.loop=true;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=280;
 const am=AC.createGain();am.gain.value=.5;const lf=AC.createOscillator();lf.frequency.value=25;const lg=AC.createGain();lg.gain.value=.5;lf.connect(lg);lg.connect(am.gain);
 purrG=AC.createGain();purrG.gain.value=0;s.connect(lp);lp.connect(am);am.connect(purrG);purrG.connect(sfx);s.start();lf.start();}
 if(AC.state==='suspended')AC.resume();}
function purr(on){if(purrG)purrG.gain.setTargetAtTime(on?.9:0,AC.currentTime,.4);}
function meow(kind){if(!AC)return;const t=AC.currentTime;if(t<lastM+1)return;lastM=t;
 const k=kind||(R()<.35?'mew':'meow'),pm=.9+R()*.3,d=k==='mew'?.28:.62,b=950*pm;
 const o=AC.createOscillator();o.type='sawtooth';const f=o.frequency;
 f.setValueAtTime(b*.8,t);f.linearRampToValueAtTime(b*1.35,t+d*.25);f.linearRampToValueAtTime(b*.8,t+d);
 const lf=AC.createOscillator(),lg=AC.createGain();lf.frequency.value=7;lg.gain.value=20;lf.connect(lg);lg.connect(f);
 const f1=AC.createBiquadFilter(),f2=AC.createBiquadFilter();f1.type=f2.type='bandpass';f1.Q.value=5;f2.Q.value=7;
 f1.frequency.setValueAtTime(900,t);f1.frequency.linearRampToValueAtTime(1800,t+d*.35);f1.frequency.linearRampToValueAtTime(1000,t+d);
 f2.frequency.setValueAtTime(2600,t);f2.frequency.linearRampToValueAtTime(3500,t+d*.4);f2.frequency.linearRampToValueAtTime(2800,t+d);
 const G=AC.createGain();G.gain.setValueAtTime(0,t);G.gain.linearRampToValueAtTime(1.3,t+.04);G.gain.setValueAtTime(1.3,t+d*.55);G.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(f1);o.connect(f2);f1.connect(G);f2.connect(G);G.connect(sfx);
 o.start(t);lf.start(t);o.stop(t+d+.05);lf.stop(t+d+.05);}

/* ===== Câmera com arrastar/zoom ===== */
let th=0,ph=.75,rad=innerWidth<innerHeight?27:19,drag=false,moved=0,lx=0,ly=0;
const cv=ren.domElement,ZMIN=10,ZMAX=36;
let dT=0;
cv.addEventListener('pointerdown',e=>{drag=true;moved=0;dT=performance.now();lx=e.clientX;ly=e.clientY;});
addEventListener('pointerup',e=>{drag=false;if(moved<6&&(e.pointerType!=='touch'||performance.now()-dT<350))pick(e);});
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);if(e.pointerType==='touch')return;th-=dx*.006;ph=Math.min(1.5,Math.max(.35,ph-dy*.005));});
cv.addEventListener('wheel',e=>{rad=Math.min(ZMAX,Math.max(ZMIN,rad+e.deltaY*.01));},{passive:true});
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function pick(e){
 if(e.target!==cv||phase!=='galaxy')return;
 mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);
 if(ray.intersectObject(catHit)[0]){meow();hop(6);popHearts(6);}
}
let cur=-1;
function openCard(c){cur=CARDS.indexOf(c);
 $('mImg').innerHTML=c.img?'<img src="'+c.img+'" alt="">':'<img class="sym" src="'+CATIMG+'" alt="">';
 $('mT').textContent=c.title;$('mP').textContent=c.text;$('modal').classList.remove('hide');}
$('close').onclick=()=>$('modal').classList.add('hide');

/* ===== Borboleta = cursor ===== */
const ptr={x:innerWidth/2,y:innerHeight*.6,vx:0,sp:0,on:false},bf=$('bf'),bfi=$('bfi');let tilt=0;
function movePtr(e){ptr.vx=e.clientX-ptr.x;ptr.sp+=Math.hypot(e.clientX-ptr.x,e.clientY-ptr.y);ptr.x=e.clientX;ptr.y=e.clientY;ptr.on=true;ptr.touch=e.pointerType==='touch';
 bf.style.transform='translate('+(ptr.x-24)+'px,'+(ptr.y-24)+'px)';bf.classList.add('on');}
addEventListener('pointermove',movePtr);addEventListener('pointerdown',movePtr);
let liftT=0;
addEventListener('pointerdown',()=>{ptr.down=true;clearTimeout(liftT);});
const lift=e=>{ptr.down=false;if(e.pointerType==='touch'){clearTimeout(liftT);liftT=setTimeout(()=>{if(!ptr.down){bf.classList.remove('on');ptr.on=false;}},2500);}};
addEventListener('pointerup',lift);addEventListener('pointercancel',lift);
document.addEventListener('mouseleave',()=>bf.classList.remove('on'));

/* ===== Túnel de viagem feito de folhas ===== */
const LN=300,tun=new THREE.Group(),lv=[];let tunOp=1;cam.add(tun);
for(let i=0;i<LN;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:leafTex,transparent:true,depthWrite:false,blending:ADD,color:new THREE.Color().setHSL(.28+R()*.14,.9,.62)}));
 const a=R()*TAU,r=2+Math.pow(R(),.7)*30,sz=1.2+R()*2;s.scale.set(sz,sz,1);s.position.set(Math.cos(a)*r,Math.sin(a)*r,-R()*300);s.userData={w:(R()-.5)*3};tun.add(s);lv.push(s);}
const ssTex=tex((x,w,h)=>{const gr=x.createLinearGradient(0,0,w,0);gr.addColorStop(0,'rgba(80,255,150,0)');gr.addColorStop(.7,'rgba(150,255,200,.55)');gr.addColorStop(1,'rgba(255,255,255,1)');
 x.fillStyle=gr;x.fillRect(0,h*.38,w,h*.24);x.fillStyle='#fff';x.shadowColor='#6dffb0';x.shadowBlur=8;x.beginPath();x.arc(w-8,h/2,h*.2,0,TAU);x.fill();},256,32);
const shooters=[];
for(let i=0;i<5;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(18,1.8),new THREE.MeshBasicMaterial({map:ssTex,transparent:true,opacity:0,depthWrite:false,depthTest:false,blending:ADD}));
 m.renderOrder=-1;m.visible=false;cam.add(m);shooters.push({m,t:0,life:1,delay:i*.9+R()*2});}
function launch(s){const a=.3+R()*.4,H=138,W=H*cam.aspect,sp=85+R()*60;
 s.life=1+R()*.8;s.t=0;s.vx=-Math.cos(a)*sp;s.vy=-Math.sin(a)*sp;
 s.m.position.set(-W*.1+R()*(W*.75),H/2+4+R()*8,-120);s.m.rotation.z=a-Math.PI;s.m.scale.setScalar(.7+R()*.7);}

let phase='idle',w0=0,lastT=0;
const bgm=$('bgm'),mus=$('mus');
/* Música de fundo: áudio do vídeo, embutido no arquivo, volume médio */
bgm.volume=.5;
function setMus(){const on=!bgm.paused;mus.textContent=on?'🔊':'🔇';mus.setAttribute('aria-label',on?'Pausar música':'Tocar música');}
let wantBgm=false;
function musPlay(){wantBgm=true;bgm.volume=.5;bgm.play().catch(()=>{});}
mus.onclick=()=>{if(bgm.paused)musPlay();else{wantBgm=false;bgm.pause();}setMus();};
document.addEventListener('visibilitychange',()=>{if(document.hidden)bgm.pause();else if(wantBgm)bgm.play().catch(()=>{});});
bgm.addEventListener('play',setMus);bgm.addEventListener('pause',setMus);
$('enter').onclick=()=>{
 $('intro').classList.add('hide');$('ctl').classList.add('on');audio();
 musPlay();phase='warp';w0=clock.getElapsedTime();};

/* Colar foto */
function setImg(src){if(cur<0)return;CARDS[cur].img=src;$('mImg').innerHTML='<img src="'+src+'" alt="">';}
function fromBlob(b){const r=new FileReader();r.onload=()=>setImg(r.result);r.readAsDataURL(b);}
$('paste').onclick=async()=>{
 try{const items=await navigator.clipboard.read();
  for(const it of items){const ty=it.types.find(t=>t.indexOf('image/')===0);if(ty){fromBlob(await it.getType(ty));return;}}}catch(e){}
 $('file').click();};
$('file').onchange=e=>{const f=e.target.files[0];if(f)fromBlob(f);e.target.value='';};
addEventListener('paste',e=>{const fs=e.clipboardData&&e.clipboardData.files;if(!fs)return;for(const f of fs){if(f.type.indexOf('image/')===0){fromBlob(f);break;}}});

/* Pinça (zoom no celular) */
const fing=new Map();let pd=0,pm=null;
cv.addEventListener('pointerdown',e=>fing.set(e.pointerId,[e.clientX,e.clientY]));
addEventListener('pointermove',e=>{if(!fing.has(e.pointerId))return;fing.set(e.pointerId,[e.clientX,e.clientY]);
 if(fing.size===2){const [a,b]=[...fing.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)rad=Math.min(ZMAX,Math.max(ZMIN,rad-(d-pd)*.05));pd=d;moved+=99;
  const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];if(pm){th-=(m[0]-pm[0])*.006;ph=Math.min(1.5,Math.max(.35,ph-(m[1]-pm[1])*.005));}pm=m;}});
const endF=e=>{fing.delete(e.pointerId);pd=0;pm=null;};
addEventListener('pointerup',endF);addEventListener('pointercancel',endF);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);U.uS.value=innerHeight*ren.getPixelRatio()/1.1547;});

/* ===== Comportamento do gatinho ===== */
const tgt=new THREE.Vector3(),hv=new THREE.Vector3(),clock=new THREE.Clock();
let wm=0,petT=0,petK=0,hT=0;
let yaw=0,vy=0,spdC=0,walk=0,wT=0,bT=2,blinkU=0,mT=0,nearT=0,st='walk',sT=0,pvx=0,pvz=0,pcd=0,cr=0,lp=0,rcS=0,headY=0;
const SPN=70,spk=pts(new Array(SPN*3).fill(0),(()=>{const c=[];for(let i=0;i<SPN;i++)c.push(...(i%2?[1,.6,.85]:[.5,.9,1]));return c;})(),.12,.9);
spk.frustumCulled=false;spk.visible=false;scene.add(spk);
const spo=Array.from({length:SPN},()=>({a:R()*TAU,r:.8+R()*2,h:R()*5,s:.3+R()*.8}));
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function overCat(){if(!ptr.on||!bf.classList.contains('on')||(ptr.touch&&!ptr.down)||!$('modal').classList.contains('hide'))return false;
 mv.set(ptr.x/innerWidth*2-1,-(ptr.y/innerHeight)*2+1);ray.setFromCamera(mv,cam);return !!ray.intersectObject(catHit)[0];}
function hop(v){if(cat.position.y<.01&&st==='walk')vy=v;}
function aim(){mv.set(ptr.x/innerWidth*2-1,-(ptr.y/innerHeight)*2+1);ray.setFromCamera(mv,cam);
 const o=ray.ray.origin,d=ray.ray.direction;let t=d.y<-.02?-o.y/d.y:99;t=Math.min(t,46);
 tgt.set(o.x+d.x*t,0,o.z+d.z*t);}
function animCat(t,dt){
 cam.updateMatrixWorld();spk.visible=true;
 if(ptr.on)aim();else if(t>wT){wT=t+3+R()*3;tgt.set((R()*2-1)*14,0,(R()*2-1)*14);}
 const p=cat.position,dx=tgt.x-p.x,dz=tgt.z-p.z,dist=Math.hypot(dx,dz);
 petT=(st==='walk'&&overCat())?petT+dt:0;const pet=petT>.12;petK+=((pet?1:0)-petK)*Math.min(1,dt*6);
 main.head.getWorldPosition(hv);hv.project(cam);
 rcS+=(cl(((1-hv.y)/2*innerHeight-ptr.y)/(innerHeight*.22),0,1)*(ptr.on?1:0)-rcS)*Math.min(1,dt*6);
 const face=(a,r)=>{let d=a-yaw;d=Math.atan2(Math.sin(d),Math.cos(d));yaw+=d*Math.min(1,dt*r);};
 const toT=Math.atan2(dx,dz),toC=Math.atan2(cam.position.x-p.x,cam.position.z-p.z);
 if(st==='walk'){
  const mvg=dist>1.4&&!pet;spdC+=((mvg?Math.min(dist*1.6,9):0)-spdC)*Math.min(1,dt*4);
  if(spdC>2&&t>wm){wm=t+2.8+R()*2.6;meow();}
  face(mvg?toT:toC,mvg?7:3);
  p.x+=Math.sin(yaw)*spdC*dt;p.z+=Math.cos(yaw)*spdC*dt;
  if(ptr.on&&!pet&&dist<3.4&&dist>1&&t>pcd&&p.y<.01){st='crouch';sT=t;}
 }else if(st==='crouch'){spdC*=.8;face(toT,10);
  if(t-sT>.5){st='leap';sT=t;vy=6.2+2.6*rcS;const T=2*vy/16;pvx=dx/T;pvz=dz/T;meow('mew');}
 }else if(st==='leap'){p.x+=pvx*dt;p.z+=pvz*dt;
  if(t-sT>.2&&p.y<=0){st='land';sT=t;pcd=t+1.5+R()*2;popHearts(2);if(R()<.6)meow();}
 }else if(t-sT>.4)st='walk';
 vy-=16*dt;p.y+=vy*dt;if(p.y<0){p.y=0;vy=0;}
 cat.rotation.y=yaw;
 const k=Math.min(spdC/4,1);walk+=spdC*dt*2.1;
 cr+=((st==='crouch'?1:st==='land'?.5:0)-cr)*Math.min(1,dt*(st==='crouch'?8:12));
 lp+=((st==='leap'?1:0)-lp)*Math.min(1,dt*12);
 const apex=Math.abs(vy)<2.5,sw=Math.sin(walk),cw=Math.cos(walk);
 const hipH=1.31-.04*k+Math.abs(cw)*.05*k-.5*cr,[a0,k0]=ik(hipH);
 const lx=.1*k+.25*cr-.1*lp*rcS,rz=sw*.07*k;
 const upL=-(1.6+1.1*rcS)+(apex?Math.sin(t*26+1)*.3:0),upR=rcS>.5?upL:-1.3+(apex?Math.sin(t*26)*.35:0);
 let hd=dist>.3?toT-yaw:0;hd=Math.atan2(Math.sin(hd),Math.cos(hd));headY+=(cl(hd,-.7,.7)-headY)*Math.min(1,dt*8);
 if(t>bT){bT=t+2+R()*3;blinkU=t+.14;}
 const el0=(-.55-.25*k)*(1-lp)-.2*lp;
 const P={hipH,lx,rz,wy:sw*.1*k+(st==='crouch'?Math.sin(t*38)*.08:0),
  th:[(a0+sw*.6*k)*(1-lp)-.7*lp-lx,(a0-sw*.6*k)*(1-lp)-.7*lp-lx],
  kn:[(k0+Math.max(0,-cw)*.9*k)*(1-lp)+1.3*lp,(k0+Math.max(0,cw)*.9*k)*(1-lp)+1.3*lp],
  sh:[(-.15-sw*.5*k+.6*cr)*(1-lp)+upL*lp,(-.15+sw*.5*k+.6*cr)*(1-lp)+upR*lp],el:[el0,el0],
  hx:Math.sin(t*1.3)*.03+.1*cr+.12*petK-(st==='walk'?0:.3*rcS),hy:headY,hz:Math.sin(t*.9)*.04-rz*.8+Math.sin(t*3.2)*.07*petK,
  ty:Math.sin(t*(2+5*petK))*(.25+.25*petK)+(st==='crouch'?Math.sin(t*16)*.35*cr:0),tz:Math.sin(t*1.5)*.1,
  ear:.1+Math.max(0,Math.sin(t*.9)-.9)*5+.3*cr+.25*petK,bl:t<blinkU?.1:1-.8*petK,ex:cl(hd-headY,-.6,.6)*.1,mo:st==='leap'||st==='land'};
 applyPose(main,P);applyPose(refl,P);
 refl.root.position.set(p.x,-p.y,p.z);refl.root.rotation.y=yaw;
 const sa=spk.geometry.attributes.position.array;
 spo.forEach((o,i)=>{o.h+=o.s*dt;if(o.h>5.5)o.h=0;o.a+=dt*.5;sa[i*3]=p.x+Math.cos(o.a)*o.r;sa[i*3+1]=p.y+o.h;sa[i*3+2]=p.z+Math.sin(o.a)*o.r;});
 spk.geometry.attributes.position.needsUpdate=true;
 purr(pet);hT-=dt;if(pet&&hT<=0){hT=.14+R()*.12;lovePuff(R()<.35?2:1);}
 if(t>mT){mT=t+6+R()*6;if(spdC<.5&&!pet)hop(4.5);}
}

/* ===== Loop principal ===== */
(function loop(){
 requestAnimationFrame(loop);
 const t=clock.getElapsedTime(),now=performance.now()/1000,dt=Math.min(.05,now-(lastT||now));lastT=now;
 let rr=rad,ee=1,spd=0;
 if(phase==='idle'){rr=rad+200;ee=0;}
 else if(phase==='warp'){
  const k=Math.min((t-w0)/4.2,1);ee=1-Math.pow(1-k,3);rr=rad+200*(1-ee);spd=25+170*Math.pow(1-ee,2);
  tunOp=k<.55?1:Math.max(0,(1-k)/.45);
  if(k>=1){phase='galaxy';tun.visible=false;$('hint').style.visibility='visible';setTimeout(()=>{$('hint').style.visibility='hidden';},6000);
   mT=t+8;hop(6);popHearts(5);}
 }
 if(phase==='warp')lv.forEach(l=>{const q=l.position;q.z+=spd*dt;if(q.z>-.5)q.z-=300;l.material.rotation+=l.userData.w*dt;l.material.opacity=tunOp*Math.min(1,-q.z/10);});
 stars.material.opacity=.8*ee*ee;U.uT.value=t;U.uA.value=ee*ee;
 if(phase==='galaxy')shooters.forEach(s=>{
  if(s.delay>0){s.delay-=dt;if(s.delay<=0){launch(s);s.m.visible=true;}return;}
  s.t+=dt;s.m.position.x+=s.vx*dt;s.m.position.y+=s.vy*dt;
  const k=s.t/s.life;s.m.material.opacity=Math.sin(Math.min(k,1)*Math.PI);
  if(k>=1){s.m.visible=false;s.delay=.4+R()*2.8;}});
 if(!drag)th+=(phase==='warp'?.004:0);
 cam.position.set(Math.sin(th)*Math.sin(ph)*rr,Math.cos(ph)*rr,Math.cos(th)*Math.sin(ph)*rr);
 cam.lookAt(0,3,0);
 if(phase==='galaxy')animCat(t,dt);
 orbit.rotation.y=-t*.05;
 const mp=motes.geometry.attributes.position.array;for(let i=0;i<400;i++){mp[i*3+1]+=dt*(.5+(i%5)*.15);if(mp[i*3+1]>9)mp[i*3+1]=0;}motes.geometry.attributes.position.needsUpdate=true;
 for(let i=hearts.length-1;i>=0;i--){const h=hearts[i],u=h.userData;u.l+=dt;h.position.y+=u.v*dt;h.position.x+=(u.dx||0)*dt;h.material.opacity=Math.max(0,1-u.l/(u.life||1.6));
  if(u.l>(u.life||1.6)){scene.remove(h);h.material.dispose();hearts.splice(i,1);}}
 ptr.sp*=.9;ptr.vx*=.8;tilt+=(Math.max(-40,Math.min(40,ptr.vx*3))-tilt)*.15;
 bfi.style.transform='rotate('+tilt+'deg) translateY('+Math.sin(t*9)*2+'px)';
 bf.style.setProperty('--fs',(ptr.sp>25?.09:.2)+'s');
 ren.render(scene,cam);
})();

if(COARSE)$('hint').textContent='Deslize o dedo para guiar o gatinho · segure nele para fazer carinho · pinça para zoom';
let ji=0;$('jur').onclick=()=>openCard(CARDS[ji++%CARDS.length]);
</script>
